<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSE 伺服器時鐘</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f4f7fb;
        }

        .clock-panel {
            max-width: 720px;
        }

        #clock {
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.05em;
        }

        #log {
            height: 200px;
            overflow-y: auto;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 0.85rem;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>
    {% include '_navbar.html' %}

    <main class="container py-5 clock-panel">
        <h1 class="mb-2">SSE 伺服器時鐘</h1>
        <p class="text-secondary">
            伺服器透過 <strong>SSE（Server-Sent Events）</strong> 每隔一秒推送一次伺服器端時間，
            瀏覽器用 <code>EventSource</code> 接收並顯示。這是「伺服器單向推資料給瀏覽器」最單純的例子。
        </p>

        <div class="card shadow-sm mb-4">
            <div class="card-body text-center">
                <div class="text-secondary small">伺服器端時間</div>
                <h1 id="clock" class="display-3 my-2">--:--:--</h1>
                <div>
                    <span id="state" class="badge text-bg-secondary">尚未連線</span>
                    <span id="lastId" class="badge text-bg-light">id: -</span>
                </div>
                <div class="mt-3">
                    <button id="stopBtn" class="btn btn-outline-danger btn-sm">關閉連線</button>
                    <button id="startBtn" class="btn btn-outline-primary btn-sm d-none">重新連線</button>
                </div>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-header">收到的事件（type / id / data）</div>
            <div id="log" class="card-body"></div>
        </div>
    </main>

    <script>
        const clock = document.querySelector('#clock');
        const state = document.querySelector('#state');
        const lastId = document.querySelector('#lastId');
        const log = document.querySelector('#log');
        const stopBtn = document.querySelector('#stopBtn');
        const startBtn = document.querySelector('#startBtn');

        let source = null;

        function addLog(line) {
            log.textContent += line + '\n';
            log.scrollTop = log.scrollHeight;
        }

        function connect() {
            // 1. 建立與伺服器的 SSE 連線（GET /api/clock）
            source = new EventSource('/api/clock');

            // 2. 連線建立（等同 source.onopen = ...）
            source.addEventListener('open', () => {
                state.className = 'badge text-bg-success';
                state.textContent = '連線中';
                addLog('[open] 已連上 /api/clock');
            });

            // 3. 伺服器送的是「自訂事件」 event: show，
            //    所以要用 addEventListener('show', ...)，message 事件不會被觸發！
            //    （若伺服器沒寫 event: 這一行，才會走預設的 message 事件 → addEventListener('message', ...)）
            source.addEventListener('show', (event) => {
                clock.textContent = event.data;                 // data: 09:41:07
                lastId.textContent = 'id: ' + event.lastEventId; // id: 12
                addLog(`show  id=${event.lastEventId}  data=${event.data}`);
            });

            // 4. 連線中斷：EventSource 會依伺服器給的 retry（5000ms）自動重連，
            //    不需要自己寫重連邏輯（等同 source.onerror = ...）
            source.addEventListener('error', () => {
                state.className = 'badge text-bg-warning';
                state.textContent = '連線中斷，5 秒後自動重連…';
                addLog('[error] 連線中斷，瀏覽器會自動重連');
            });
        }

        function disconnect() {
            if (source) {
                source.close();        // 主動關閉就不會再自動重連
                source = null;
            }
            state.className = 'badge text-bg-secondary';
            state.textContent = '已關閉';
            addLog('[close] 已主動關閉連線');
            stopBtn.classList.add('d-none');
            startBtn.classList.remove('d-none');
        }

        stopBtn.addEventListener('click', disconnect);
        startBtn.addEventListener('click', () => {
            startBtn.classList.add('d-none');
            stopBtn.classList.remove('d-none');
            connect();
        });

        // 進頁面就連線
        connect();
    </script>
</body>

</html>
