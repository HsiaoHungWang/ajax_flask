<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajax_Flask 專案</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <style>
        #div1 {
            position: absolute;
            top: calc(100% + 4px);
            /* 放在 input 下面一點 */
            left: 0;
            z-index: 1000;
            /* 讓它出現在其他元件上層 */
            width: 100%;
            /* 跟 input 一樣寬 */
            background-color: white;
            border: 1px solid #ccc;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        .input-wrapper {
            position: relative;
        }
    </style>
</head>

<body>
    {% include '_navbar.html' %}


    <div class="container mt-3">
        <div class="d-flex justify-content-between align-items-center">
            <nav class="mx-auto">
                <ul class="pagination">

                </ul>
            </nav>
            <div class="ms-auto input-wrapper">
                <input id="InputSearch" type="search" class="form-control" placeholder="景點搜尋" />
                <!-- <input id="InputSearch" type="search" onkeyup="search(event)" class="form-control" placeholder="景點搜尋" /> -->
                <div class="list-group" id="div1">

                </div>
            </div>
        </div>
        <div id="divSpots" class="row row-cols-1 row-cols-md-3 g-4">

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
        crossorigin="anonymous"></script>
    <script>
        const ulPagination = document.querySelector('.pagination');
        const div1 = document.querySelector('#divSpots');
        const divList = document.querySelector('#div1');
        const inpSearch = document.querySelector('#InputSearch');

        const DEFAULT_IMAGE = '/static/images/empty.png';

        const search_params = {
            "keyword": "",
            "page": 1,
            "per_page": 9,
            "sort_by": "AttractionID",
            "sort_order": "asc"
        }

        // AJAX 1：搜尋框「自動完成」
        // 每次使用者在輸入框打字（input 事件）都會觸發一次，
        // 呼叫後端 /api/attraction-title，用目前輸入的文字去查詢符合的景點名稱
        inpSearch.addEventListener('input', async (event) => {
            console.log(event.target);

            // 1. 組出要呼叫的 API 網址，把使用者輸入的字當成 keyword 參數帶過去
            const apiUrl1 = 'http://127.0.0.1:5000/api/attraction-title'
            const url = `${apiUrl1}?keyword=${event.target.value}`;

            // 2. fetch 送出 GET 請求；await 代表「先在這裡等，直到伺服器回應」
            const response = await fetch(url);

            // 3. 把伺服器回傳的 JSON 字串解析成 JavaScript 陣列
            const titles = await response.json();

            // 4. 把每個景點名稱轉成一個按鈕的 HTML 字串
            //    點下按鈕時會呼叫 clickHandler()，帶入該景點名稱
            const htmlTitles = titles.map(title => `<button onclick="clickHandler('${title}')" type="button" class="list-group-item  list-group-item-action">${title}</button>`);

            // 5. 把組好的按鈕 HTML 塞進下拉建議清單的容器裡，畫面就會顯示出來
            divList.innerHTML = htmlTitles.join('');
        })

        // AJAX 2：讀取景點卡片列表
        // 這是整個頁面「查資料、畫卡片」的核心函式，
        // 會依照目前的 search_params（關鍵字、頁碼、排序方式...）向後端要資料
        const loadDatas = async () => {
            // 1. 把 search_params 物件轉成網址的 QueryString，
            //    例如 { keyword: "陽明山", page: 1 } 會變成 "keyword=陽明山&page=1"
            const queryString = new URLSearchParams(search_params).toString();

            // 2. 呼叫後端 /api/attractions，帶上上面組好的查詢條件
            const apiUrl = `http://127.0.0.1:5000/api/attractions?${queryString}`
            const response = await fetch(apiUrl);

            // 3. 解析回傳的 JSON，格式為 { total_pages, total_count, data: [...] }
            const datas = await response.json();

            // 4. 依照總頁數重新畫分頁按鈕
            pagination(datas.total_pages);

            // 5. 把每一筆景點資料轉成一張卡片的 HTML，最後統一塞進畫面
            const cards = datas.data.map(attraction => {
                const { AttractionID, AttractionName, City, Town, StreetAddress, Description, Image } = attraction;
                const address = `${City || ''}${Town || ''}${StreetAddress || ''}`;
                const description = Description ? Description.substring(0, 100) : '';
                return (
                    `<div class="col">
                        <div class="card h-100">
                            <img src="${Image || DEFAULT_IMAGE}" class="card-img-top" alt="${AttractionName}" style="height: 200px; object-fit: cover;" />
                            <div class="card-body d-flex flex-column">
                                <h5 class="card-title">${AttractionName}</h5>
                                <p class="card-text flex-grow-1">${description}</p>
                            </div>
                            <div class="card-footer">
                                <small class="text-body-secondary">${address}</small>
                            </div>
                        </div>
                    </div>
                `)
            })

            // 6. innerHTML 一次性覆蓋，把卡片畫到 #divSpots 容器裡
            div1.innerHTML = cards.join('');
        }

        // 換頁：更新 search_params.page，然後重新呼叫 AJAX (loadDatas) 拿新資料
        const pageChange = page => {
            search_params.page = page;
            loadDatas();
        }

        // 點下自動完成清單裡的某個景點名稱時：
        // 把名稱填進輸入框、清空下拉清單，並直接以該名稱重新查詢（觸發 AJAX）
        const clickHandler = title => {
            inpSearch.value = title;
            divList.innerHTML = '';

            search_params.keyword = title;
            search_params.page = 1;
            loadDatas();
        }

        // 在輸入框按下 Enter 鍵（keyCode 13）時，才真正送出關鍵字搜尋（觸發 AJAX）
        // 跟上面 'input' 事件不同：'input' 是每打一個字就查自動完成建議，
        // 這裡是按 Enter 才去查詢完整的卡片列表
        inpSearch.addEventListener('keyup', event => {
            if (event.which === 13) {
                search_params.keyword = event.target.value;
                search_params.page = 1;
                loadDatas();
            }
        })



        //建立分頁按鈕
        const pagination = pages => {
            let liPage = '';
            for (let i = 1; i <= pages; i++) {
                if (i > 10) break;
                if (search_params.page === i) {
                    liPage += ` <li class="page-item active" onclick="pageChange(${i})"><a class="page-link" href="#">${i}</a></li>`
                } else {
                    liPage += ` <li class="page-item" onclick="pageChange(${i})"><a class="page-link" href="#">${i}</a></li>`
                }

            }
            ulPagination.innerHTML = liPage;
        }

        // 頁面一載入就先呼叫一次 loadDatas()，取得第一頁的景點資料並顯示
        loadDatas();
    </script>
</body>

</html>
